services:
  app:
    build: .
    command: uvicorn coupon_rush.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://coupon_rush:coupon_rush@postgres:5432/coupon_rush
      TEST_DATABASE_URL: postgresql+asyncpg://coupon_rush:coupon_rush@postgres:5432/coupon_rush_test
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: coupon_rush
      POSTGRES_PASSWORD: coupon_rush
      POSTGRES_DB: coupon_rush
    ports:
      - "5432:5432"
    volumes:
      - coupon_pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U coupon_rush -d coupon_rush" ]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  coupon_pgdata:

